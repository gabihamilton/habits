<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily habits</title>
<style>
  :root {
    --bg: #F7F5F0;
    --card: #FFFFFF;
    --ink: #1F1D1A;
    --ink-soft: #6B675F;
    --line: #E4E0D6;
    --done-bg: #E4EEE2;
    --done-line: #8FB88A;
    --done-ink: #2F5C33;
    --accent: #3B5B92;
    --accent-soft: #EDF1F8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px 80px;
  }
  main {
    width: 100%;
    max-width: 480px;
  }
  header {
    margin-bottom: 20px;
  }
  .eyebrow {
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 0 0 4px;
  }
  h1 {
    font-size: 24px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .sub {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0;
  }
  .stats {
    display: flex;
    gap: 10px;
    margin: 20px 0;
  }
  .stat {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .stat .num {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.1;
  }
  .stat .label {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 2px;
  }
  .list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .habit {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
    user-select: none;
  }
  .habit:active { transform: scale(0.995); }
  .habit.done {
    background: var(--done-bg);
    border-color: var(--done-line);
  }
  .check {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid var(--line);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: transparent;
    transition: all 0.15s ease;
  }
  .habit.done .check {
    background: var(--done-line);
    border-color: var(--done-line);
    color: white;
  }
  .habit .label {
    font-size: 15px;
    flex: 1;
  }
  .habit.done .label {
    color: var(--done-ink);
  }
  nav.week {
    display: flex;
    gap: 6px;
    margin: 28px 0 8px;
  }
  .day-pill {
    flex: 1;
    text-align: center;
    padding: 8px 4px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 12px;
    color: var(--ink-soft);
  }
  .day-pill .d { font-weight: 600; color: var(--ink); font-size: 13px; }
  .day-pill.full { background: var(--accent-soft); border-color: var(--accent); }
  .day-pill.full .d { color: var(--accent); }
  footer {
    margin-top: 24px;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
  }
</style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow" id="today-eyebrow"></p>
    <h1>Daily habits</h1>
    <p class="sub">Small, checkable wins — not a two-year countdown.</p>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="num" id="stat-today">0/9</div>
      <div class="label">Today</div>
    </div>
    <div class="stat">
      <div class="num" id="stat-streak">0</div>
      <div class="label">Day streak</div>
    </div>
  </div>

  <div class="list" id="habit-list"></div>

  <nav class="week" id="week-strip"></nav>

  <footer>Saved on this device only.</footer>
</main>

<script>
const HABITS = [
  { id: 'stretch', label: 'Stretching' },
  { id: 'workout', label: 'Working out' },
  { id: 'walk', label: 'Walk (10 min)' },
  { id: 'run', label: 'Run (5 min)' },
  { id: 'weight', label: 'Tracked weight' },
  { id: 'food', label: 'Tracked food' },
  { id: 'bedtime', label: 'Bed on time' },
  { id: 'quant', label: '5 quant exercises' },
  { id: 'analysis', label: 'Analysis (1h)' },
];

const STORE_KEY = 'gabi-habit-tracker';

function loadStore() {
  try {
    return JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
  } catch (e) {
    return {};
  }
}

function saveStore(store) {
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}

function dateKey(d) {
  return d.toISOString().slice(0, 10);
}

function fullyDone(dayState) {
  if (!dayState) return false;
  return HABITS.every(h => dayState[h.id]);
}

function computeStreak(store) {
  let streak = 0;
  let cursor = new Date();
  while (true) {
    const key = dateKey(cursor);
    if (fullyDone(store[key])) {
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    } else {
      break;
    }
  }
  return streak;
}

let store = loadStore();
const todayKey = dateKey(new Date());

function render() {
  const dayState = store[todayKey] || {};
  const doneCount = HABITS.filter(h => dayState[h.id]).length;

  document.getElementById('today-eyebrow').textContent =
    new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  document.getElementById('stat-today').textContent = doneCount + '/' + HABITS.length;
  document.getElementById('stat-streak').textContent = computeStreak(store);

  const list = document.getElementById('habit-list');
  list.innerHTML = '';
  HABITS.forEach(h => {
    const done = !!dayState[h.id];
    const row = document.createElement('div');
    row.className = 'habit' + (done ? ' done' : '');
    row.innerHTML = '<div class="check">' + (done ? '&#10003;' : '') + '</div><div class="label">' + h.label + '</div>';
    row.addEventListener('click', () => {
      const s = store[todayKey] || {};
      s[h.id] = !s[h.id];
      store[todayKey] = s;
      saveStore(store);
      render();
    });
    list.appendChild(row);
  });

  const strip = document.getElementById('week-strip');
  strip.innerHTML = '';
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const key = dateKey(d);
    const full = fullyDone(store[key]);
    const pill = document.createElement('div');
    pill.className = 'day-pill' + (full ? ' full' : '');
    pill.innerHTML = '<div class="d">' + d.toLocaleDateString(undefined, { weekday: 'narrow' }) + '</div>' + d.getDate();
    strip.appendChild(pill);
  }
}

render();
</script>
</body>
</html>
